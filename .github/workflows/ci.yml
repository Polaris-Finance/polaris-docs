name: Validate docs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: ''
      NEXT_PUBLIC_BASE_PATH: ''
      SITE_URL: https://docs.polaris.finance
      NEXT_PUBLIC_SITE_URL: https://docs.polaris.finance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate docs
        run: npm run ci

      - name: Check external links
        run: npm run check:links:external
        continue-on-error: true
