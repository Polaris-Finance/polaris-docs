name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

# Shared base path / site URL inherited by every job.
env:
  BASE_PATH: ''
  NEXT_PUBLIC_BASE_PATH: ''
  SITE_URL: https://docs.polaris.finance
  NEXT_PUBLIC_SITE_URL: https://docs.polaris.finance

jobs:
  validate:
    name: Validate and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so Nextra can read each page's last-modified git timestamp.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate static export
        run: npm run ci

      - name: Check external links
        run: npm run check:links:external
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          include-hidden-files: true

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Checkout smoke checker
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Smoke check deployed Pages site
        # page_url is GitHub's ground truth for where Pages actually serves the
        # site; asserting canonicals against it (instead of the SITE_URL that
        # generated them) catches a misconfigured SITE_URL at deploy time.
        env:
          LIVE_ARTIFACT_EXPECTED_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run check:live-artifact -- --base-url "${{ steps.deployment.outputs.page_url }}"
